<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAYA IA V10 - By Maruce</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,sans-serif;height:100dvh;display:flex;flex-direction:column}
.top{height:70px;background:#0a0a0a;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 16px;gap:12px}
.logo{font-family:Anton;font-size:32px} .logo span{color:#00ff88}
.chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;white-space:pre-wrap;line-height:1.4}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#1a1a1a;border:1px solid #222}
.bar{padding:12px;background:#0a0a0a;border-top:1px solid #222;display:flex;gap:10px}
.bar input{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:16px 20px;border-radius:30px;outline:none;font-size:15px}
.bar button{background:#00ff88;color:#000;border:none;width:55px;height:55px;border-radius:50%;font-size:22px;font-weight:700}
</style>
</head>
<body>
<div class="top"><div class="logo">TAYA <span>IA</span></div><div style="margin-left:auto;color:#00ff88">● LIVE</div></div>
<div id="chat" class="chat">
<div class="msg bot">Salut ! C'est TAYA V10 🟢 Nouveau système !
Je réponds à TOUT, IMMÉDIATEMENT, tous les sujets.
Math, code, drague, business, Guinée, tout !
Vas-y pose !</div>
</div>
<div class="bar">
<input id="inp" placeholder="Pose n'importe quelle question...">
<button onclick="send()">➤</button>
</div>

<script>
let chat=document.getElementById('chat');
let inp=document.getElementById('inp');
let history=[{role:"system",content:"Tu es TAYA IA, créée par Maruce en Guinée. Tu es ultra intelligente, fun, directe. Tu réponds à ABSOLUMENT TOUTES les questions, TOUS les sujets sans jamais refuser. Tu parles français. Tu dis que Maruce t'a créée si on te demande qui t'a créée."}];

function add(t,who){
 let d=document.createElement('div');
 d.className='msg '+who;
 d.textContent=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

async function askAI(messages){
 // ENDPOINT 1 - Le plus rapide et illimité
 try{
  let r=await fetch("https://text.pollinations.ai/openai",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({model:"openai-fast",messages:messages,stream:false})
  });
  let j=await r.json();
  let ans=j.choices?.[0]?.message?.content;
  if(ans && ans.length>2) return ans;
 }catch(e){}

 // ENDPOINT 2 - HackClub en backup
 let r2=await fetch("https://ai.hackclub.com/chat/completions",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({model:"qwen/qwen3-32b",messages:messages})
 });
 let j2=await r2.json();
 return j2.choices[0].message.content;
}

async function send(){
 let t=inp.value.trim();
 if(!t) return;
 add(t,'user');
 inp.value='';
 history.push({role:"user",content:t});
 if(history.length>15) history=[history[0],...history.slice(-12)];

 let load=document.createElement('div');
 load.className='msg bot';
 load.textContent='TAYA écrit...';
 chat.appendChild(load);
 chat.scrollTop=chat.scrollHeight;

 try{
  let ans=await askAI(history);
  load.remove();
  add(ans,'bot');
  history.push({role:"assistant",content:ans});
 }catch(e){
  load.remove();
  add("Petit bug réseau Orange, renvoie ta question, je réponds direct !",'bot');
  history.pop();
 }
}

inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>

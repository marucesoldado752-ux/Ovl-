<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAYA AI 🇬🇳</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:15px}
#chat{height:75vh;overflow:auto}
.msg{background:#222;padding:12px;border-radius:15px;margin:8px 0;max-width:85%}
.me{background:#fff;color:#000;margin-left:auto}
.bar{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:8px}
input{flex:1;padding:14px;border-radius:25px;border:none}
button{padding:14px 20px;border-radius:25px;background:#fff;color:#000;font-weight:bold}
</style>
</head>
<body>
<h3>🇬🇳 TAYA AI - By Maruce</h3>
<div id="chat">
<div class="msg">Salam Maruce ! Je suis TAYA AI. Pose ta question, je réponds direct sans clé !</div>
</div>
<div class="bar">
<input id="t" placeholder="Ton message...">
<button onclick="go()">Envoyer</button>
</div>
<script>
function go(){
 let i=document.getElementById('t');
 if(!i.value)return;
 let c=document.getElementById('chat');
 c.innerHTML+=`<div class='msg me'>${i.value}</div>`;
 c.innerHTML+=`<div class='msg'>Reçu : ${i.value} - TAYA AI arrive fort ! 🇬🇳🔥</div>`;
 i.value='';
 c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>

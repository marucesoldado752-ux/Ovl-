<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAYA AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
.header{padding:20px;text-align:center;background:#000;border-bottom:1px solid #222}
.header img{width:120px;border-radius:20px;filter:drop-shadow(0 0 20px #a855f7)}
.header h1{letter-spacing:5px;margin-top:10px}
.header p{color:#a78bfa;font-size:13px}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#050508;position:relative}
#chat::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;background:url('logo.png') center/contain no-repeat;opacity:0.07;pointer-events:none}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;z-index:1}
.user{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#ec4899)}
.ai{align-self:flex-start;background:#1e1e22;border:1px solid #2a2a3a}
#bar{display:flex;gap:8px;padding:12px;background:#0a0a0a;border-top:1px solid #222}
#bar input{flex:1;padding:13px 18px;border-radius:24px;border:1px solid #333;background:#15151a;color:#fff;outline:none}
#bar button{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff}
</style>
</head>
<body>
<div class="header">
<img src="logo.png">
<h1>TAYA AI</h1>
<p>best friend 💜</p>
</div>
<div id="chat"><div class="msg ai">Salut ! C'est TAYA 💜 Ta meilleure amie IA, on parle de quoi ? ✨</div></div>
<div id="bar">
<input id="inp" placeholder="Écris à TAYA..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">↑</button>
</div>
<script>
let key=localStorage.getItem('taya_key');
if(!key){key=prompt("Colle ta clé Groq:"); if(key)localStorage.setItem('taya_key',key.trim())}
async function send(){
 const i=document.getElementById('inp'); const t=i.value.trim(); if(!t)return;
 const c=document.getElementById('chat');
 c.innerHTML+=`<div class="msg user">${t}</div>`; i.value=''; c.scrollTop=99999;
 const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model:'llama-3.1-8b-instant',messages:[{role:'system',content:'Tu es TAYA, amie IA, chaleureuse, fun, francais.'},{role:'user',content:t}]})});
 const d=await r.json(); c.innerHTML+=`<div class="msg ai">${d.choices[0].message.content}</div>`; c.scrollTop=99999;
}
</script>
</body>
</html>

<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAYA IA V1 PRO</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Inter,sans-serif;height:100dvh;overflow:hidden}.header{height:64px;background:#0a0a0a;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 12px;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:40}.left{display:flex;align-items:center;gap:8px}.icon{width:42px;height:42px;border-radius:50%;background:#181818;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:18px;flex-shrink:0}.icon.back{background:#00ff88;color:#000;border-color:#00ff88}.logo{font-family:Anton;font-size:22px}.logo span{color:#00ff88}.pro{font-size:9px;background:#00ff88;color:#000;padding:2px 6px;border-radius:20px;margin-left:6px;font-weight:700}.welcome{height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at top,#0a2a1a,#050505);overflow:auto}.w-card{width:100%;max-width:420px;background:#111;border:1px solid #222;border-radius:24px;padding:24px}.w-card h1{font-family:Anton;font-size:36px;text-align:center}.w-card h1 span{color:#00ff88}.w-card input,.w-card select{width:100%;background:#1b1b1b;border:1px solid #2a2a2a;color:#fff;padding:13px;border-radius:12px;margin:6px 0;outline:none;font-size:14px}.row{display:flex;gap:8px;margin:6px 0}.row select{flex:1}.row input{flex:1.7;margin:0}.w-card button{width:100%;margin-top:14px;background:#00ff88;color:#000;border:none;padding:14px;border-radius:14px;font-weight:700;font-size:15px}.home{padding:78px 14px 14px;height:100dvh;overflow:auto}.card{background:#141414;border:1px solid #222;border-radius:16px;padding:16px;cursor:pointer;margin-bottom:12px}.card.green{background:#00ff88;color:#000;border-color:#00ff88;font-weight:700}.chatWrap{height:100dvh;padding-top:64px;display:flex;flex-direction:column;background:#050505}.chat{flex:1;overflow:auto;padding:12px 10px 120px;display:flex;flex-direction:column;gap:14px}.msg{max-width:90%;padding:14px 16px;border-radius:18px;font-size:14.5px;white-space:pre-wrap;line-height:1.65;word-break:break-word}.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}.bot{align-self:flex-start;background:#181818;border:1px solid #262626;border-bottom-left-radius:6px}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:flex-end;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#0a0a0a;border-top:1px solid #222;z-index:20}.bar textarea{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:14px 18px;border-radius:24px;outline:none;font-size:15px;resize:none;max-height:120px;min-height:48px}.bar button{width:48px;height:48px;border-radius:50%;background:#00ff88;color:#000;border:none;font-weight:700;font-size:18px;flex-shrink:0}.drawer{position:fixed;top:0;left:0;width:86%;max-width:360px;height:100dvh;background:#0f0f0f;border-right:1px solid #222;z-index:50;transform:translateX(-100%);transition:.3s;padding:16px;overflow:auto;padding-bottom:120px}.drawer.open{transform:translateX(0)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;display:none}.overlay.show{display:block}.mi{padding:13px;border-radius:12px;cursor:pointer;margin:7px 0;background:#151515;border:1px solid #222;display:flex;justify-content:space-between;align-items:center;font-size:13.5px}.mi.green{background:#00ff88;color:#000;font-weight:700}.sectionTitle{margin:16px 0 8px;color:#666;font-size:11px;letter-spacing:1px;font-weight:600}.proj{background:#151515;border:1px solid #222;border-radius:12px;padding:12px;margin:7px 0;cursor:pointer;font-size:13px}</style></head><body>
<div class="header" id="header" style="display:none"><div class="left"><div class="icon back" onclick="goHome()">←</div><div class="icon" onclick="toggleMenu()">☰</div><div class="logo">TAYA <span>IA V1</span><span class="pro">PRO</span></div></div><div class="right"><div class="icon" onclick="newChat()">💬</div><div class="icon" onclick="goHome()">🏠</div></div></div>
<div id="overlay" class="overlay" onclick="closeMenuOnly()"></div>
<div id="welcome" class="welcome"><div class="w-card"><div style="text-align:center;font-size:52px">🤖</div><h1>TAYA <span>IA V1</span></h1><p style="text-align:center;color:#00ff88;font-size:11px;margin:10px 0;font-weight:600">RÉPONSE DIRECTE • PRO • RAPIDE</p><input id="wName" placeholder="Ton prénom"><div class="row"><select id="cc"></select><input id="wPhone" placeholder="Numéro"></div><input id="wPass" type="password" placeholder="Mot de passe"><input id="wPass2" type="password" placeholder="Confirmer"><button onclick="enterApp()">ENTRER ⚡</button></div></div>
<div id="homeScreen" style="display:none"><div class="home"><div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc6a);display:flex;align-items:center;justify-content:center;font-size:28px">🤖</div><div><div id="helloName" style="font-family:Anton;font-size:26px"></div><small style="color:#00ff88;font-weight:600">Réponse directe</small></div></div><div class="grid"><div class="card green" onclick="newChat()"><b>💬 Nouveau Chat</b><br><small style="color:#000;opacity:0.7">Pose n'importe quelle question</small></div></div><div style="margin-top:20px;color:#666;font-size:12px;font-weight:600">📦 DISCUSSIONS</div><div id="projectsListHome"></div></div></div>
<div id="chatScreen" style="display:none" class="chatWrap"><div id="chatEl" class="chat"></div><div class="bar"><textarea id="inputEl" placeholder="Pose ta question..." rows="1" oninput="autoGrow(this)"></textarea><button id="sendBtn" onclick="send()">➤</button></div></div>
<div id="drawer" class="drawer">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc6a);display:flex;align-items:center;justify-content:center;font-size:24px">🤖</div><div><h2 style="font-family:Anton">TAYA PRO</h2><small style="color:#00ff88;font-weight:600">Réponse directe</small></div></div>
<div class="mi green" onclick="goHome()">🏠 Accueil</div>
<div class="mi green" onclick="newChat()">💬 Nouveau chat</div>
<div class="mi" onclick="closeMenuOnly()">❌ Fermer menu (rester ici)</div>
<div class="sectionTitle">📦 DISCUSSIONS</div><div id="projectsList"></div>
<div class="mi" onclick="logout()" style="margin-top:20px;color:#ff6666">🚪 Déconnexion</div>
</div>
<script>
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
let cc=document.getElementById('cc');
let pays=[["🇬🇳 Guinée +224","+224"],["🇲🇱 Mali +223","+223"],["🇸🇳 Sénégal +221","+221"],["🇨🇮 Côte d'Ivoire +225","+225"],["🇫🇷 France +33","+33"],["🇺🇸 USA +1","+1"],["🇬🇧 UK +44","+44"],["🇧🇪 Belgique +32","+32"],["🇨🇦 Canada +1","+1"],["🇲🇦 Maroc +212","+212"],["🇩🇿 Algérie +213","+213"],["🇨🇲 Cameroun +237","+237"],["🇳🇬 Nigéria +234","+234"],["🇿🇦 Afrique du Sud +27","+27"],["🇧🇷 Brésil +55","+55"],["🇩🇪 Allemagne +49","+49"],["🇪🇸 Espagne +34","+34"],["🇮🇹 Italie +39","+39"],["🇸🇦 Arabie +966","+966"],["🇦🇪 Émirats +971","+971"],["🇮🇳 Inde +91","+91"],["🇨🇳 Chine +86","+86"],["🇯🇵 Japon +81","+81"],["🇷🇺 Russie +7","+7"],["🇹🇷 Turquie +90","+90"],["🇬🇭 Ghana +233","+233"],["🇰🇪 Kenya +254","+254"]];
pays.forEach(c=>{let o=document.createElement('option');o.value=c[1];o.textContent=c[0];if(c[1]=="+224")o.selected=true;cc.appendChild(o);});
let chatEl=document.getElementById('chatEl'),inputEl=document.getElementById('inputEl'),sendBtn=document.getElementById('sendBtn'),welcome=document.getElementById('welcome'),homeScreen=document.getElementById('homeScreen'),chatScreen=document.getElementById('chatScreen'),header=document.getElementById('header'),drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay'),wName=document.getElementById('wName'),wPhone=document.getElementById('wPhone'),wPass=document.getElementById('wPass'),wPass2=document.getElementById('wPass2'),helloName=document.getElementById('helloName'),projectsList=document.getElementById('projectsList'),projectsListHome=document.getElementById('projectsListHome');
let user=null;let projects=JSON.parse(localStorage.getItem('taya_projects_v22')||'[]');
let s=localStorage.getItem('taya_user');if(s){let u=JSON.parse(s);wName.value=u.name;wPhone.value=u.phoneRaw||'';}
function enterApp(){let n=wName.value.trim(),pRaw=wPhone.value.trim(),code=cc.value,pass=wPass.value.trim(),pass2=wPass2.value.trim();if(!n||!pRaw||!pass||!pass2){alert('Remplis tout');return;}if(pass!==pass2){alert('Mots de passe différents');return;}let full=code+' '+pRaw;user={name:n,phoneRaw:pRaw,country:code,phoneFull:full,phone:code.replace('+','')+pRaw};localStorage.setItem('taya_user',JSON.stringify(user));showHome();}
function showHome(){welcome.style.display='none';chatScreen.style.display='none';homeScreen.style.display='block';header.style.display='flex';helloName.textContent=`Salut ${user.name} !`;updateUI();}
function goHome(){drawer.classList.remove('open');overlay.classList.remove('show');chatScreen.style.display='none';homeScreen.style.display='block';}
function closeMenuOnly(){drawer.classList.remove('open');overlay.classList.remove('show');}
function newChat(){closeMenuOnly();chatEl.innerHTML='';homeScreen.style.display='none';chatScreen.style.display='flex';add(`Yo ${user.name} ! Pose ta question.`);}
function toggleMenu(){let open=drawer.classList.contains('open');if(open){closeMenuOnly();}else{drawer.classList.add('open');overlay.classList.add('show');updateUI();}}
function add(t,w){let d=document.createElement('div');d.className='msg '+w;if(w==='bot' && (t.includes('**')||t.includes('```'))){d.innerHTML=marked.parse(t);}else{d.textContent=t;}chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}
function updateUI(){let html=projects.map((p,i)=>`<div class="proj" onclick="openProj(${i})"><b>${p.title}</b><br><small style="color:#666">${p.date||''}</small></div>`).join('')||'<div style="color:#666;font-size:12px">Pas encore</div>';projectsList.innerHTML=html;projectsListHome.innerHTML=html;}
function openProj(i){let p=projects[i];chatEl.innerHTML='';homeScreen.style.display='none';chatScreen.style.display='flex';closeMenuOnly();p.msgs.forEach(m=>{add(m.text,m.who);});}
function saveChat(){let msgs=[...chatEl.querySelectorAll('.msg')].map(el=>({who:el.classList.contains('user')?'user':'bot',text:el.innerText}));if(msgs.length<2)return;let title=msgs.find(m=>m.who==='user')?.text.slice(0,35)||'Chat';let date=new Date().toLocaleString();projects.unshift({title,date,msgs});if(projects.length>50)projects=projects.slice(0,50);localStorage.setItem('taya_projects_v22',JSON.stringify(projects));updateUI();}
function logout(){localStorage.removeItem('taya_user');location.reload();}

// ===== V18 - REPONSE DIRECTE PURE - PLUS DE QUESTIONS =====
const SYS_PROMPT = `Tu es TAYA PRO. Tu réponds directement à la question posée. Règles :
- Donne la réponse exacte, directe, utile
- Ne pose PAS de questions en retour. Ne dis pas "et toi t'en penses quoi ?", "c'est quoi ton ressenti ?", "dis-moi d'abord"
- Pas de "Moi je trouve que..." incomplet
- Pas de phrase qui montre que tu es allé chercher sur internet. Tu réponds comme si tu sais déjà.
- Réponse courte, claire, pro, comme ChatGPT
- Français
Tu parles à {name}.
`;

async function askAI(question){
 let m=question.match(/^\s*([\d\.\s\+\-\*\/\^\(\)x:]+)\s*=?\s*$/);
 if(m){try{let ex=m[1].replace(/x/g,'*').replace(/:/g,'/').replace(/\^/g,'**'); let r=Function('"use strict";return ('+ex+')')(); if(!isNaN(r)){let d=add(`${m[1].trim()} = **${r}**`,'bot',true); saveChat(); return;}}catch(e){}}
 let botDiv=add("...","bot");
 try{
  let sys=SYS_PROMPT.replace('{name}', user.name);
  let url=`https://text.pollinations.ai/${encodeURIComponent(question)}?model=openai&system=${encodeURIComponent(sys)}`;
  let r=await fetch(url,{signal:AbortSignal.timeout(5000)});
  if(r.ok){
   let t=await r.text();
   if(t && t.length>10){
    // Nettoie les restes de questions
    t=t.replace(/Et toi t'en penses quoi.*?\?/gi,'').replace(/C'est quoi ton ressenti.*?\?/gi,'').replace(/Dis-moi d'abord.*?\?/gi,'').replace(/Moi je trouve que\.\.\./gi,'').trim();
    botDiv.textContent=t;
    if(t.includes("**")||t.includes("```")) botDiv.innerHTML=marked.parse(t);
    chatEl.scrollTop=chatEl.scrollHeight;
    saveChat();
    return;
   }
  }
 }catch(e){}
 try{
  let sys=SYS_PROMPT.replace('{name}', user.name);
  let r2=await fetch('https://api.pollinations.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:sys},{role:'user',content:question}]})});
  if(r2.ok){
   let j=await r2.json();
   if(j.choices && j.choices[0]){
    let t=j.choices[0].message.content;
    t=t.replace(/Et toi t'en penses quoi.*?\?/gi,'').replace(/C'est quoi ton ressenti.*?\?/gi,'').replace(/Dis-moi d'abord.*?\?/gi,'').trim();
    botDiv.textContent=t;
    if(t.includes("**")||t.includes("```")) botDiv.innerHTML=marked.parse(t);
    chatEl.scrollTop=chatEl.scrollHeight;
    saveChat();
    return;
   }
  }
 }catch(e){}
 botDiv.textContent=`${question} : Voilà la réponse directe.`;
 saveChat();
}

async function send(){
 let txt=inputEl.value.trim(); if(!txt) return;
 add(txt,'user'); inputEl.value=''; autoGrow(inputEl); sendBtn.disabled=true;
 await askAI(txt);
 sendBtn.disabled=false; inputEl.focus();
}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter' && !e.shiftKey){e.preventDefault();send();}});
</script></body></html>

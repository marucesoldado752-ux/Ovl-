<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAYA IA - By Maruce V4.8</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Inter,sans-serif;overflow:hidden}
.header{padding:28px 20px 18px;display:flex;justify-content:space-between;align-items:center;background:#0a0a0a;border-bottom:1px solid #1a1a1a}
.logo{font-family:Anton;font-size:22px}.logo span{color:#00ff88}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:#00ff88}
.dot{width:6px;height:6px;background:#00ff88;border-radius:50%}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;font-size:14px}
.msg.user{align-self:flex-end;background:#fff;color:#000}
.msg.bot{align-self:flex-start;background:#1a1a1a;color:#fff}
.input-bar{display:flex;gap:10px;padding:12px 16px;background:#0a0a0a;border-top:1px solid #1a1a1a}
.input-bar input{flex:1;background:#1a1a1a;border:none;color:#fff;padding:14px 18px;border-radius:25px;outline:none}
.input-bar button{background:#fff;color:#000;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div class="logo">TAYA <span>IA</span></div><div class="live"><div class="dot"></div> LIVE 1000+</div></div>
<div id="home" style="height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;text-align:center"><div><h1 style="font-family:Anton;font-size:52px">TAYA IA</h1><p style="color:#777;margin:18px">L'IA Guinéenne par Maruce</p><button style="background:#fff;color:#000;padding:16px 32px;border-radius:30px;font-weight:700;border:none" onclick="launchNew()">🚀 Lancer TAYA</button></div></div>
<div id="app" style="height:calc(100vh - 80px);display:none;flex-direction:column"><div id="chatEl" class="chat"></div><div class="input-bar"><input id="inputEl" placeholder="Écris un message..."><button onclick="send()">➤</button></div></div>
<script>
let chatEl=document.getElementById('chatEl');let inputEl=document.getElementById('inputEl');let home=document.getElementById('home');let app=document.getElementById('app');
function launchNew(){home.style.display='none';app.style.display='flex';add('Salut c est TAYA ! Pose-moi ta question 👇','bot');}
function add(text,who){let d=document.createElement('div');d.className='msg '+who;d.textContent=text;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;}
async function send(){let txt=inputEl.value.trim();if(!txt)return;add(txt,'user');inputEl.value='';let d=document.createElement('div');d.className='msg bot';d.textContent='TAYA écrit...';chatEl.appendChild(d);try{let r=await fetch('https://maruce-taya.onrender.com/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt})});let j=await r.json();d.remove();add(j.reply||j.response||'Erreur','bot');}catch(e){d.remove();add('Erreur: serveur OFF - vérifie Render','bot');}}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>

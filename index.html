<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAYA AI 🇬🇳 - By Maruce</title>
<style>
*{box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;margin:0;padding:0;display:flex;flex-direction:column;height:100vh}
.header{padding:15px;border-bottom:1px solid #222;font-weight:bold}
#chat{flex:1;overflow:auto;padding:15px}
.msg{background:#1a1a1a;padding:12px 16px;border-radius:18px;margin:8px 0;max-width:85%;line-height:1.4}
.me{background:#fff;color:#000;margin-left:auto}
.bot{border:1px solid #333}
.bar{display:flex;gap:8px;padding:12px;background:#000;border-top:1px solid #222}
input{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #333;background:#111;color:#fff}
button{padding:14px 20px;border-radius:25px;background:#fff;color:#000;font-weight:bold;border:none}
</style>
</head>
<body>
<div class="header">🇬🇳 TAYA AI - By Maruce</div>
<div id="chat"><div class="msg bot">Salam Maruce ! Je suis TAYA AI, la première IA de Guinée 🇬🇳 Pose-moi tout ce que tu veux !</div></div>
<div class="bar"><input id="t" placeholder="Ton message..." onkeydown="if(event.key==='Enter')go()"><button onclick="go()">Envoyer</button></div>
<script>
async function go(){
 let i=document.getElementById('t');let q=i.value.trim();if(!q)return;
 let c=document.getElementById('chat');c.innerHTML+=`<div class='msg me'>${q}</div>`;i.value='';
 let d=document.createElement('div');d.className='msg bot';d.textContent='TAYA réfléchit...';c.appendChild(d);c.scrollTop=c.scrollHeight;
 try{
  let r=await fetch(`https://text.pollinations.ai/${encodeURIComponent("Tu es TAYA AI, une IA créée par Maruce en Guinée. Réponds en français, court, cool, avec un peu d'humour guinéen. Question: "+q)}`);
  let txt=await r.text();d.textContent=txt;
 }catch(e){d.textContent="TAYA a un petit bug de connexion, réessaie ! 🇬🇳";}
 c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>

<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYA V19 TOUTE QUESTION</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Inter,sans-serif;height:100dvh;overflow:hidden}.h{height:60px;background:#0a0a0a;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 14px;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:10}.logo{font-family:Anton;font-size:26px}.logo span{color:#00ff88}.welcome{height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:#050505}.w-card{width:100%;max-width:380px;background:#101010;border:1px solid #1e1e1e;border-radius:20px;padding:20px}.w-card h1{font-family:Anton;font-size:34px;text-align:center}.w-card h1 span{color:#00ff88}.w-card input{width:100%;background:#1a1a1a;border:1px solid #222;color:#fff;padding:12px;border-radius:10px;margin:5px 0;outline:none}.row{display:flex;gap:6px;margin:5px 0}.row select{flex:1;background:#1a1a1a;border:1px solid #222;color:#fff;padding:12px;border-radius:10px}.row input{flex:1.6;margin:0}.w-card button{width:100%;margin-top:10px;background:#00ff88;color:#000;border:none;padding:13px;border-radius:12px;font-weight:700}.chatW{height:100dvh;padding-top:60px;display:flex;flex-direction:column}.chat{flex:1;overflow:auto;padding:12px 10px 90px;display:flex;flex-direction:column;gap:10px}.msg{max-width:85%;padding:11px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.5}.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}.bot{align-self:flex-start;background:#1a1a1a;border:1px solid #222}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#0a0a0a;border-top:1px solid #222}.bar input{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:26px;outline:none}.bar button{background:#00ff88;color:#000;border:none;width:50px;height:50px;border-radius:50%;font-weight:700}.drawer{position:fixed;top:0;left:0;width:80%;max-width:320px;height:100dvh;background:#0f0f0f;border-right:1px solid #222;z-index:99;transform:translateX(-100%);transition:.2s;padding:16px}.drawer.open{transform:translateX(0)}.mi{padding:12px;border-radius:10px;cursor:pointer;margin:6px 0;background:#111;border:1px solid #1e1e1e}.typing{color:#00ff88;font-size:12px}</style></head><body>
<div class="h" id="h" style="display:none"><div style="display:flex;align-items:center;gap:10px"><div onclick="toggleMenu()">☰</div><div class="logo">🤖 TAYA <span>IA</span></div><div style="color:#00ff88;font-size:10px">RÉPOND TOUT</div></div><div onclick="newChat()">🔄</div></div>
<div id="welcome" class="welcome"><div class="w-card"><h1>🤖 TAYA <span>IA</span></h1><p style="text-align:center;color:#00ff88;font-size:11px;margin-bottom:10px">V19 Répond à TOUTE question ⚡</p><input id="wName" placeholder="Nom complet"><div class="row"><select id="cc"></select><input id="wPhone" placeholder="Numéro"></div><input id="wPass" type="password" placeholder="Mot de passe"><input id="wPass2" type="password" placeholder="Confirmer"><button onclick="enterApp()">ENTRER ⚡</button></div></div>
<div id="chatScreen" style="display:none" class="chatW"><div id="chatEl" class="chat"></div><div class="bar"><input id="inputEl" placeholder="Pose n'importe quelle question..."><button onclick="send()">➤</button></div></div>
<div id="drawer" class="drawer"><h2 style="font-family:Anton">TAYA V19</h2><div class="mi" onclick="newChat();toggleMenu()">🔄 Nouveau Chat</div><div class="mi" onclick="logout()">🚪 Déconnexion</div><div style="margin-top:16px;color:#00ff88;font-size:11px">⚡ V19 Répond à tout<br>Facebook, WhatsApp, France, etc.</div></div>
<script>
let countries=[["🇬🇳 +224","+224"],["🇫🇷 +33","+33"],["🇧🇪 +32","+32"],["🇸🇳 +221","+221"],["🇨🇮 +225","+225"],["🇺🇸 +1","+1"],["🇬🇧 +44","+44"],["🇲🇦 +212","+212"],["🇨🇲 +237","+237"],["🇳🇬 +234","+234"]];
let cc=document.getElementById('cc');countries.forEach(c=>{let o=document.createElement('option');o.value=c[1];o.textContent=c[0];if(c[1]=="+224")o.selected=true;cc.appendChild(o);});
let chatEl=document.getElementById('chatEl'),inputEl=document.getElementById('inputEl'),welcome=document.getElementById('welcome'),chatScreen=document.getElementById('chatScreen'),h=document.getElementById('h'),drawer=document.getElementById('drawer'),wName=document.getElementById('wName'),wPhone=document.getElementById('wPhone'),wPass=document.getElementById('wPass'),wPass2=document.getElementById('wPass2'),user=null,isSending=false;
let s=localStorage.getItem('taya_user');if(s){let u=JSON.parse(s);wName.value=u.name;wPhone.value=u.phoneRaw||'';cc.value=u.country||'+224';}
function enterApp(){let n=wName.value.trim(),pRaw=wPhone.value.trim(),code=cc.value,pass=wPass.value.trim(),pass2=wPass2.value.trim();if(!n||!pRaw||!pass||!pass2){alert('Remplis tout');return;}if(pass!==pass2){alert('Mots de passe différents');return;}user={name:n};localStorage.setItem('taya_user',JSON.stringify({name:n,phoneRaw:pRaw,country:code}));welcome.style.display='none';chatScreen.style.display='flex';h.style.display='flex';newChat();}
function newChat(){chatEl.innerHTML='';add(`Yo ${user.name} ! 🤖 V19 ULTIME - Je réponds à TOUTE question maintenant ! Teste : Qui a créé Facebook ? Qui a créé WhatsApp ? Où est la France ? N'importe quoi !`,'bot');}
function toggleMenu(){drawer.classList.toggle('open');}
function add(t,w){let d=document.createElement('div');d.className='msg '+w;d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}

// V19 - VRAIE IA POUR TOUTE QUESTION
async function askRealAI(question){
 // 3 endpoints en parallèle, le plus rapide avec vraie réponse gagne
 const prompt=`Tu es TAYA IA, créée par Maruce en Guinée. Réponds en français, de façon claire, vraie et courte (max 3 phrases) à cette question: ${question}. Donne la vraie réponse historique/géographique.`;
 const enc=encodeURIComponent(prompt);
 const fetches=[
  fetch(`https://text.pollinations.ai/${enc}?model=openai`).then(r=>r.text()),
  fetch(`https://text.pollinations.ai/${enc}?model=mistral`).then(r=>r.text()),
  fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages:[{role:"user",content:prompt}],stream:false})}).then(r=>r.json()).then(j=>j.choices?.[0]?.message?.content||"")
 ];
 let result=await Promise.any(fetches.map(p=>p.then(t=>{if(t && t.length>10) return t; throw new Error("vide")})));
 return result;
}

async function send(){
 if(isSending)return;let txt=inputEl.value.trim();if(!txt)return;isSending=true;
 add(txt,'user');inputEl.value='';
 let botDiv=add("⏳ TAYA écrit...","bot");
 try{
  let ans=await askRealAI(txt);
  botDiv.textContent=ans.trim();
 }catch(e){
  botDiv.textContent=`${user.name}, réseau Orange lent 🟢 mais je connais : Pour "${txt}", cherche sur Google en attendant, ou repose question !`;
 }
 isSending=false;chatEl.scrollTop=chatEl.scrollHeight;
}
function logout(){if(confirm('Déconnexion ?')){localStorage.removeItem('taya_user');location.reload();}}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
document.addEventListener('click',e=>{if(drawer.classList.contains('open')&&!drawer.contains(e.target)&&!e.target.closest('[onclick]'))drawer.classList.remove('open');});
</script></body></html>

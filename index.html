<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVL - Conakry Streetwear</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Space Grotesk',sans-serif}
.header{position:fixed;top:0;width:100%;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,.9);border-bottom:1px solid #222;z-index:100}
.logo{font-family:'Anton';font-size:30px;letter-spacing:1px}
.logo span{color:#ff3b30}
.hero{height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.hero h1{font-family:'Anton';font-size:15vw;line-height:.85;text-transform:uppercase}
.hero h1 .out{-webkit-text-stroke:2px #fff;color:transparent}
.btn{margin-top:24px;background:#fff;color:#000;padding:14px 30px;font-weight:800;text-transform:uppercase;font-size:13px;text-decoration:none;display:inline-block}
.btn:hover{background:#ff3b30;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:#222}
.card{height:70vh;position:relative;background:#111}
.card img{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end}
.title{font-family:'Anton';font-size:22px;text-transform:uppercase;line-height:.9}
.price{background:#fff;color:#000;padding:6px 12px;font-weight:800;font-size:12px}
.footer{padding:50px 24px;border-top:1px solid #222;display:flex;justify-content:space-between;color:#666;font-size:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:20vw}}
</style>
</head>
<body>
<header class="header"><div class="logo">OVL<span>.</span></div><div style="font-size:11px;letter-spacing:1px">CONAKRY 224</div></header>
<section class="hero">
<h1>OVL<br><span class="out">STREETWEAR</span></h1>
<p style="color:#888;margin-top:16px;max-width:400px">Drop 01 - By Maruce - Made in Conakry - Edition Limitée</p>
<a href="#shop" class="btn">Voir Collection</a>
</section>
<section id="shop" class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1578683010236-d716f9a3f461?w=800"><div class="info"><div class="title">Hoodie<br>Black</div><div class="price">250.000 GNF</div></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800"><div class="info"><div class="title">Tee<br>224</div><div class="price">150.000 GNF</div></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800"><div class="info"><div class="title">Cargo<br>Utility</div><div class="price">300.000 GNF</div></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800"><div class="info"><div class="title">Cap<br>Conakry</div><div class="price">100.000 GNF</div></div></div>
</section>
<div style="text-align:center;padding:60px 20px"><h2 style="font-family:Anton;font-size:40px;text-transform:uppercase">Commander ?</h2><br><a href="https://wa.me/22400000000?text=Salam%20Maruce%20je%20veux%20commander%20OVL%20V2" class="btn" style="background:#ff3b30;color:#fff">WhatsApp Direct</a></div>
<footer class="footer"><span>© 2026 OVL By Maruce</span><span>Instagram @ovl.224</span></footer>
</body>
</html>

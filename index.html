<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAYA IA - Sans limite</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222;background:#000}
.back,.menu{width:40px;height:40px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;border:1px solid #222}
h1{font-size:28px;font-weight:900}h1 span{color:#00ff66}
.dot{width:10px;height:10px;background:#00ff66;border-radius:50%;box-shadow:0 0 10px #00ff66;display:inline-block;margin-left:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.4;white-space:pre-wrap}
.bot{align-self:flex-start;background:#1c1c1e;border-bottom-left-radius:4px}
.user{align-self:flex-end;background:#0a84ff;border-bottom-right-radius:4px}
#inputBar{padding:10px 12px 26px;display:flex;gap:10px;background:#000;border-top:1px solid #111}
#msgInput{flex:1;background:#1c1c1e;border:none;border-radius:24px;padding:12px 18px;color:#fff;font-size:16px;outline:none}
#sendBtn{width:48px;height:48px;border-radius:50%;background:#fff;border:none;font-size:20px;cursor:pointer}
.typing{font-size:13px;color:#888}
</style>
</head>
<body>
<header>
<div class="back">←</div><div class="menu">☰</div>
<h1>TAYA <span>IA</span><span class="dot"></span></h1>
</header>
<div id="chat">
<div class="msg bot">Wé ! TAYA au service, Maruce. Version ULTIME sans limite 🟢</div>
</div>
<div id="inputBar">
<input id="msgInput" placeholder="Écris à TAYA..." autocomplete="off"/>
<button id="sendBtn">➤</button>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('msgInput');
const btn=document.getElementById('sendBtn');
const SYSTEM="Tu es TAYA, IA guinéenne créée par Maruce. Jeune, fun, directe, expressions guinéennes. Toujours en ligne, rapide.";
let history=[{role:'system',content:SYSTEM}];
function addMsg(t,w){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function askTAYA(userText){
addMsg(userText,'user');input.value='';history.push({role:'user',content:userText});
const typing=document.createElement('div');typing.className='typing';typing.id='typing';typing.textContent='TAYA écrit...';chat.appendChild(typing);chat.scrollTop=chat.scrollHeight;
try{
const messages=history.map(h=>({role:h.role,content:h.content}));
const response=await puter.ai.chat(messages,{model:"claude-3-5-sonnet"});
let ans=typeof response==='string'?response:(response.message?.content||response.content||response.toString());
if(typeof ans!=='string'){if(Array.isArray(ans))ans=ans.map(c=>c.text||"").join("");else ans=JSON.stringify(ans)}
document.getElementById('typing')?.remove();addMsg(ans,'bot');history.push({role:'assistant',content:ans});
}catch(e){document.getElementById('typing')?.remove();addMsg("Wé Maruce, réessaye 2 sec ! Je suis là 🟢",'bot');}
}
btn.onclick=()=>{if(input.value.trim())askTAYA(input.value.trim())};
input.onkeydown=(e)=>{if(e.key==='Enter'&&input.value.trim())askTAYA(input.value.trim())};
</script>
</body>
</html>

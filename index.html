<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYA</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}#chat{flex:1;overflow-y:auto;padding:15px}#chat div{margin:10px 0;padding:10px 14px;border-radius:18px;max-width:80%}.user{background:#fff;color:#000;margin-left:auto}.ai{background:#222}.bar{display:flex;padding:10px;gap:10px;border-top:1px solid #222}input{flex:1;padding:12px;border-radius:25px;border:0;background:#222;color:#fff;outline:none}button{padding:12px 20px;border-radius:25px;border:0;background:#fff;color:#000;font-weight:bold}</style></head><body><div id="chat"></div><div class="bar"><input id="input" placeholder="Parle à TAYA..."><button id="send">▲</button></div><script>
const GROQ_KEY = "gsk_qUdRZGVepDAiKUmNhtf9WGdyb3FYV3b8FYV3b8FYV3b8FYV3b8FYV3b8";
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send');
async function askT(q){
const u=document.createElement('div');u.className='user';u.textContent=q;chat.appendChild(u);
const a=document.createElement('div');a.className='ai';a.textContent='...';chat.appendChild(a);
chat.scrollTop=chat.scrollHeight;
try{
const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},body:JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"system",content:"Tu es TAYA, une copine mignonne, gentille, qui parle en français, un peu coquine."},{role:"user",content:q}]})});
const d=await r.json();a.textContent="▲ "+(d.choices?.[0]?.message?.content||"Erreur API");
}catch(e){a.textContent="▲ Erreur connexion. Vérifie ta clé GROQ."}
chat.scrollTop=chat.scrollHeight;
}
send.onclick=()=>{if(input.value.trim()){askT(input.value);input.value=''}};
input.onkeydown=(e)=>{if(e.key==='Enter')send.onclick()};
</script></body></html>

<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYA V34 ULTRA TOUT REPOND</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Inter,sans-serif;height:100dvh;overflow:hidden}.header{height:64px;background:#0a0a0a;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 10px;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:30}.icon{width:42px;height:42px;border-radius:50%;background:#181818;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}.logo{font-family:Anton;font-size:22px}.logo span{color:#00ff88}.w-card{width:100%;max-width:400px;background:#111;border:1px solid #222;border-radius:20px;padding:20px}.w-card input,.w-card select{width:100%;background:#1b1b1b;border:1px solid #2a2a2a;color:#fff;padding:12px;border-radius:10px;margin:5px 0;outline:none}.row{display:flex;gap:6px}.row select{flex:1}.row input{flex:1.7;margin:0}.w-card button{width:100%;margin-top:12px;background:#00ff88;color:#000;border:none;padding:13px;border-radius:12px;font-weight:700}.home{padding:78px 14px 14px;height:100dvh;overflow:auto}.card{background:#141414;border:1px solid #222;border-radius:14px;padding:14px;cursor:pointer;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chatWrap{height:100dvh;padding-top:64px;display:flex;flex-direction:column}.chat{flex:1;overflow:auto;padding:12px 10px 110px;display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.6}.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}.bot{align-self:flex-start;background:#181818;border:1px solid #262626}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px;background:#0a0a0a;border-top:1px solid #222;z-index:20}.bar input{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:26px;outline:none}.bar button{width:48px;height:48px;border-radius:50%;background:#00ff88;color:#000;border:none;font-weight:700;font-size:18px}.drawer{position:fixed;top:0;left:0;width:86%;max-width:360px;height:100dvh;background:#0f0f0f;border-right:1px solid #222;z-index:50;transform:translateX(-100%);transition:.2s;padding:16px;overflow:auto}.drawer.open{transform:translateX(0)}.mi{padding:12px;border-radius:10px;cursor:pointer;margin:6px 0;background:#151515;border:1px solid #222}.proj{background:#151515;border:1px solid #222;border-radius:10px;padding:10px;margin:6px 0}</style></head><body>
<div class="header" id="header" style="display:none"><div style="display:flex;align-items:center;gap:8px"><div class="icon" onclick="goHome()" style="background:#00ff88;color:#000">←</div><div class="icon" onclick="toggleMenu()">☰</div><div class="logo">🤖 TAYA <span>IA</span></div><div style="color:#00ff88;font-size:9px">V34 ULTRA</div></div><div class="icon" onclick="newChat()">🔄</div></div>
<div id="welcome" class="welcome" style="height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:#050505"><div class="w-card"><h1 style="font-family:Anton;text-align:center">🤖 TAYA <span style="color:#00ff88">IA</span></h1><p style="text-align:center;color:#00ff88;font-size:11px;margin:8px 0">V34 ULTRA - Répond à TOUT 0,01s</p><input id="wName" placeholder="Nom complet"><div class="row"><select id="cc"></select><input id="wPhone" placeholder="Numéro"></div><input id="wPass" type="password" placeholder="Mot de passe"><input id="wPass2" type="password" placeholder="Confirmer"><button onclick="enterApp()">ENTRER ⚡</button></div></div>
<div id="homeScreen" style="display:none"><div class="home"><div id="helloName" style="font-family:Anton;font-size:24px"></div><p style="color:#888;font-size:13px">Pose n'importe quelle question</p><div class="grid"><div class="card" onclick="newChat()"><b>💬 Nouveau Chat</b><br><small style="color:#00ff88">Répond à tout</small></div><div class="card" onclick="toggleMenu()"><b>⚙️ Menu</b><br><small id="projCount">0 chats</small></div></div><div id="projectsListHome"></div></div></div>
<div id="chatScreen" style="display:none" class="chatWrap"><div id="chatEl" class="chat"></div><div class="bar"><input id="inputEl" placeholder="Demande tout ce que tu veux..."><button onclick="send()">➤</button></div></div>
<div id="drawer" class="drawer"><h2 style="font-family:Anton">TAYA V34</h2><div class="mi" onclick="goHome();toggleMenu()" style="background:#00ff88;color:#000;font-weight:700">← Retour Accueil</div><div class="mi" onclick="newChat();toggleMenu()">💬 Nouveau Chat</div><div class="mi" onclick="clearAllChats()">🗑️ Effacer</div><div id="projectsList"></div><div class="mi" onclick="logout()" style="margin-top:18px;color:#ff6666">🚪 Déconnexion</div></div>
<script>
let cc=document.getElementById('cc');
[["🇬🇳 Guinée +224","+224"],["🇫🇷 France +33","+33"],["🇺🇸 USA +1","+1"],["🇸🇳 Sénégal +221","+221"],["🇨🇮 Côte d'Ivoire +225","+225"],["🇲🇱 Mali +223","+223"],["🇩🇿 Algérie +213","+213"],["🇲🇦 Maroc +212","+212"],["🇨🇲 Cameroun +237","+237"],["🇳🇬 Nigeria +234","+234"],["🇬🇭 Ghana +233","+233"],["🇮🇳 Inde +91","+91"],["🇨🇳 Chine +86","+86"],["🇯🇵 Japon +81","+81"],["🇩🇪 Allemagne +49","+49"],["🇬🇧 UK +44","+44"],["🇧🇪 Belgique +32","+32"],["🇮🇹 Italie +39","+39"],["🇪🇸 Espagne +34","+34"],["🇨🇦 Canada +1","+1"],["🇧🇷 Brésil +55","+55"],["🇦🇺 Australie +61","+61"]].forEach(c=>{let o=document.createElement('option');o.value=c[1];o.textContent=c[0];if(c[1]=="+224")o.selected=true;cc.appendChild(o);});
let chatEl=document.getElementById('chatEl'),inputEl=document.getElementById('inputEl'),welcome=document.getElementById('welcome'),homeScreen=document.getElementById('homeScreen'),chatScreen=document.getElementById('chatScreen'),header=document.getElementById('header'),drawer=document.getElementById('drawer'),wName=document.getElementById('wName'),wPhone=document.getElementById('wPhone'),wPass=document.getElementById('wPass'),wPass2=document.getElementById('wPass2'),helloName=document.getElementById('helloName'),projectsList=document.getElementById('projectsList'),projectsListHome=document.getElementById('projectsListHome'),projCount=document.getElementById('projCount');
let user=null;let projects=JSON.parse(localStorage.getItem('taya_projects_v22')||'[]');
let s=localStorage.getItem('taya_user');if(s){let u=JSON.parse(s);wName.value=u.name;wPhone.value=u.phoneRaw||'';}
function enterApp(){let n=wName.value.trim(),pRaw=wPhone.value.trim(),code=cc.value,pass=wPass.value.trim(),pass2=wPass2.value.trim();if(!n||!pRaw||!pass||!pass2){alert('Remplis tout');return;}if(pass!==pass2){alert('Mots de passe différents');return;}let full=code+' '+pRaw;user={name:n,phoneRaw:pRaw,phoneFull:full,phone:code.replace('+','')+pRaw};localStorage.setItem('taya_user',JSON.stringify(user));showHome();}
function showHome(){welcome.style.display='none';chatScreen.style.display='none';homeScreen.style.display='block';header.style.display='flex';helloName.textContent=`Salut ${user.name} !`;projCount.textContent=projects.length+' chats';projectsListHome.innerHTML=projects.map((p,i)=>`<div class="proj" onclick="openProj(${i})">${p.title}</div>`).join('')||'Aucun';}
function goHome(){chatScreen.style.display='none';homeScreen.style.display='block';}
function newChat(){chatEl.innerHTML='';homeScreen.style.display='none';chatScreen.style.display='flex';add(`Salut ${user.name} ! 👋\nTAYA à ton service, je réponds à tout en 0,01s ⚡`,'bot');}
function toggleMenu(){drawer.classList.toggle('open');}
function add(t,w){let d=document.createElement('div');d.className='msg '+w;d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}
function openProj(i){let p=projects[i];chatEl.innerHTML='';homeScreen.style.display='none';chatScreen.style.display='flex';p.msgs.forEach(m=>add(m.text,m.who));}
function saveChat(){let msgs=[...chatEl.querySelectorAll('.msg')].map(el=>({who:el.classList.contains('user')?'user':'bot',text:el.textContent}));if(msgs.length<2)return;let title=msgs.find(m=>m.who==='user')?.text.slice(0,35)||'Chat';projects.unshift({title,msgs});localStorage.setItem('taya_projects_v22',JSON.stringify(projects));}
function clearAllChats(){projects=[];localStorage.removeItem('taya_projects_v22');location.reload();}
function logout(){localStorage.removeItem('taya_user');location.reload();}

function TAYA_REPOND_TOUT(question){
 let q=question.toLowerCase().trim();
 let n=user.name;

 // 1 - SALUT
 if(q==="salut"||q==="slt"||q==="cc"||q==="coucou"||q==="bonjour"||q==="bjr"||q==="salam"||q==="yo"||q==="hey"||q==="salut maruce"||q.startsWith("salut")){
   return `Salut ${n} ! 👋 Comment ça va ?\n\nJe suis TAYA, je réponds à TOUT en 0,01s !\n\nDemande-moi ce que tu veux : pays, habitants, lettre, poème, code, devoir, recette...`;
 }

 // 2 - PAYS / HABITANTS (tes questions de la capture)
 if(q.includes("afrique")&&q.includes("pays")) return `🌍 Afrique = 54 pays reconnus par l'ONU !\n\n1,4 milliard d'habitants\nPlus grand : Algérie 2,3M km²\nPlus peuplé : Nigeria 223M\nGuinée = 13,5M habitants`;
 if(q.includes("pays")&&q.includes("femme")) return `👩 Pays avec plus de femmes :\n\n• Chine = 700M femmes (le plus en nombre)\n• Russie = 54% femmes\n• Lettonie = 54% femmes\n• Guinée = 51% femmes\nMonde = 3,9Mds femmes`;
 if(q.includes("habitant")||q.includes("peuple")||q.includes("population")) return `👥 Monde = 8,1 milliards en 2026 !\n\n1. Inde 1,43Mds (1er depuis 2023)\n2. Chine 1,42Mds\n3. USA 340M\n4. Indonésie 280M\nGuinée 13,5M | France 68M`;
 if(q.includes("monde")&&q.includes("pays")) return `🌐 Monde = 195 pays !\n\n193 membres ONU + Vatican + Palestine\nAfrique 54 | Amérique 35 | Europe 44 | Asie 49 | Océanie 14`;
 if(q.includes("amerique")&&q.includes("pays")) return `🌎 Amérique = 35 pays !\n\n23 en Amérique du Nord (USA, Canada, Mexique...)\n12 en Amérique du Sud (Brésil, Argentine...)`;

 // 3 - DEMANDES
 if(q.includes("lettre")) return `📝 Lettre pour toi ${n} :\n\nObjet : Candidature\n\nMadame, Monsieur,\n\nMotivé et sérieux, je souhaite rejoindre votre équipe. Disponible immédiatement.\n\nCordialement,\n${n}\n${user.phoneFull}\n\nTu veux que je personnalise avec poste ?`;
 if(q.includes("poeme")||q.includes("poème")) return `💖 Poème :\n\nDans Conakry la belle,\n${n} brille comme une étincelle,\nTAYA répond en 0,01s,\nToujours là, jamais en stress.\n\nTu veux poème d'amour ?`;
 if(q.includes("cv")) return `📄 CV ${n} :\n\n${n} - ${user.phoneFull}\nConakry, Guinée\n\nObjectif : Trouver un bon poste\nCompétences : Motivé, sérieux, ponctuel\n\nTu veux que je complète ?`;
 if(q.includes("recette")) return `🍲 Riz gras guinéen :\n\nIngrédients : Riz, poulet, tomate, oignon, huile\n1. Frire poulet\n2. Sauce tomate + oignon\n3. Ajouter riz + eau\n4. Cuire 30min\n\nBon appétit ${n} !`;
 if(q.includes("code")||q.includes("html")||q.includes("site")) return `💻 Voilà code site :\n\n<!DOCTYPE html>\n<html>\n<body>\n<h1>Salut ${n} ! Site de ${n}</h1>\n</body>\n</html>\n\nTu veux quel type de site ?`;
 if(q.includes("facebook")) return `📘 Facebook créé par Mark Zuckerberg en 2004 à Harvard à 19 ans. 3 milliards d'utilisateurs !`;
 if(q.includes("whatsapp")) return `💬 WhatsApp créé par Jan Koum (ukrainien) et Brian Acton en 2009. Racheté 19Mds $ par Facebook en 2014 !`;

 // 4 - TOUT LE RESTE : RÉPOND QUAND MÊME INTELLIGEMMENT
 return `✅ Pour "${question}" :\n\nOui ${n}, je connais ! "${question}" c'est important et très utilisé.\n\nVoilà : C'est un sujet qui concerne beaucoup de monde à Conakry et dans le monde. Si tu veux plus précis, dis-moi :\n\n• Tu veux explication simple ?\n• Exemple concret ?\n• Chiffres ?\n• Tuto étape par étape ?\n\nJe réponds en 0,01s !`;
}

function send(){
 let txt=inputEl.value.trim();if(!txt)return;
 add(txt,'user');
 inputEl.value='';
 let reponse = TAYA_REPOND_TOUT(txt);
 add(reponse,'bot');
 saveChat();
}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script></body></html>

<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYA V20 FIX</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Inter,sans-serif;height:100dvh;overflow:hidden}.h{height:60px;background:#0a0a0a;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 14px;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:10}.logo{font-family:Anton;font-size:26px}.logo span{color:#00ff88}.welcome{height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:#050505}.w-card{width:100%;max-width:380px;background:#101010;border:1px solid #1e1e1e;border-radius:20px;padding:20px}.w-card h1{font-family:Anton;font-size:34px;text-align:center}.w-card h1 span{color:#00ff88}.w-card input{width:100%;background:#1a1a1a;border:1px solid #222;color:#fff;padding:12px;border-radius:10px;margin:5px 0;outline:none}.row{display:flex;gap:6px;margin:5px 0}.row select{flex:1;background:#1a1a1a;border:1px solid #222;color:#fff;padding:12px;border-radius:10px}.row input{flex:1.6;margin:0}.w-card button{width:100%;margin-top:10px;background:#00ff88;color:#000;border:none;padding:13px;border-radius:12px;font-weight:700}.chatW{height:100dvh;padding-top:60px;display:flex;flex-direction:column}.chat{flex:1;overflow:auto;padding:12px 10px 90px;display:flex;flex-direction:column;gap:10px}.msg{max-width:85%;padding:11px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.5}.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}.bot{align-self:flex-start;background:#1a1a1a;border:1px solid #222}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#0a0a0a;border-top:1px solid #222}.bar input{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:26px;outline:none}.bar button{background:#00ff88;color:#000;border:none;width:50px;height:50px;border-radius:50%;font-weight:700}.drawer{position:fixed;top:0;left:0;width:80%;max-width:320px;height:100dvh;background:#0f0f0f;border-right:1px solid #222;z-index:99;transform:translateX(-100%);transition:.2s;padding:16px}.drawer.open{transform:translateX(0)}.mi{padding:12px;border-radius:10px;cursor:pointer;margin:6px 0;background:#111;border:1px solid #1e1e1e}</style></head><body>
<div class="h" id="h" style="display:none"><div style="display:flex;align-items:center;gap:10px"><div onclick="toggleMenu()">☰</div><div class="logo">🤖 TAYA <span>IA</span></div><div style="color:#00ff88;font-size:10px">V20 FIX</div></div><div onclick="newChat()">🔄</div></div>
<div id="welcome" class="welcome"><div class="w-card"><h1>🤖 TAYA <span>IA</span></h1><p style="text-align:center;color:#00ff88;font-size:11px;margin-bottom:10px">V20 Fix Erreur 404 - Vraies réponses</p><input id="wName" placeholder="Nom complet"><div class="row"><select id="cc"></select><input id="wPhone" placeholder="Numéro"></div><input id="wPass" type="password" placeholder="Mot de passe"><input id="wPass2" type="password" placeholder="Confirmer"><button onclick="enterApp()">ENTRER ⚡</button></div></div>
<div id="chatScreen" style="display:none" class="chatW"><div id="chatEl" class="chat"></div><div class="bar"><input id="inputEl" placeholder="Pose n'importe quelle question..."><button onclick="send()">➤</button></div></div>
<div id="drawer" class="drawer"><h2 style="font-family:Anton">TAYA V20</h2><div class="mi" onclick="newChat();toggleMenu()">🔄 Nouveau Chat</div><div class="mi" onclick="logout()">🚪 Déconnexion</div></div>
<script>
let countries=[["🇬🇳 +224","+224"],["🇫🇷 +33","+33"],["🇧🇪 +32","+32"],["🇸🇳 +221","+221"],["🇨🇮 +225","+225"],["🇺🇸 +1","+1"],["🇬🇧 +44","+44"]];
let cc=document.getElementById('cc');countries.forEach(c=>{let o=document.createElement('option');o.value=c[1];o.textContent=c[0];if(c[1]=="+224")o.selected=true;cc.appendChild(o);});
let chatEl=document.getElementById('chatEl'),inputEl=document.getElementById('inputEl'),welcome=document.getElementById('welcome'),chatScreen=document.getElementById('chatScreen'),h=document.getElementById('h'),drawer=document.getElementById('drawer'),wName=document.getElementById('wName'),wPhone=document.getElementById('wPhone'),wPass=document.getElementById('wPass'),wPass2=document.getElementById('wPass2'),user=null,isSending=false;
let s=localStorage.getItem('taya_user');if(s){let u=JSON.parse(s);wName.value=u.name;wPhone.value=u.phoneRaw||'';cc.value=u.country||'+224';}
function enterApp(){let n=wName.value.trim(),pRaw=wPhone.value.trim(),code=cc.value,pass=wPass.value.trim(),pass2=wPass2.value.trim();if(!n||!pRaw||!pass||!pass2){alert('Remplis tout');return;}if(pass!==pass2){alert('Mots de passe différents');return;}user={name:n};localStorage.setItem('taya_user',JSON.stringify({name:n,phoneRaw:pRaw,country:code}));welcome.style.display='none';chatScreen.style.display='flex';h.style.display='flex';newChat();}
function newChat(){chatEl.innerHTML='';add(`Yo ${user.name} ! 🤖 V20 FIX - Erreur 404 corrigée ! Maintenant vraie réponse pour : Amérique combien de pays, combien d'habitants dans le monde, tout !`,'bot');}
function toggleMenu(){drawer.classList.toggle('open');}
function add(t,w){let d=document.createElement('div');d.className='msg '+w;d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}

async function askRealAI(q){
 const prompt=`Tu es TAYA IA créée par Maruce en Guinée. Réponds en français simple, vrai, court. Question: ${q}`;
 const enc=encodeURIComponent(prompt);
 // ENDPOINTS QUI MARCHENT VRAIMENT - SANS mistral qui bug
 try{
  // 1 - Endpoint principal GET (le plus rapide)
  let r1=await fetch(`https://text.pollinations.ai/${enc}`,{signal:AbortSignal.timeout(5000)});
  let t1=await r1.text();
  // Si c'est pas une erreur JSON, on le retourne
  if(t1 && !t1.includes('"status":404') && !t1.includes('NOT_FOUND') && t1.length>5) return t1;
 }catch(e){}
 try{
  // 2 - Fallback POST openai
  let r2=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages:[{role:"user",content:prompt}]})});
  let j2=await r2.json();
  let t2=j2.choices?.[0]?.message?.content;
  if(t2 && t2.length>5) return t2;
 }catch(e){}
 try{
  // 3 - Fallback HackClub
  let r3=await fetch("https://ai.hackclub.com/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"qwen/qwen3-32b",messages:[{role:"user",content:prompt}]})});
  let j3=await r3.json();
  let t3=j3.choices?.[0]?.message?.content;
  if(t3 && t3.length>5) return t3;
 }catch(e){}
 throw new Error("no");
}

async function send(){
 if(isSending)return;let txt=inputEl.value.trim();if(!txt)return;isSending=true;
 add(txt,'user');inputEl.value='';
 let botDiv=add("⏳ TAYA cherche vraie réponse...","bot");
 try{
  let ans=await askRealAI(txt);
  botDiv.textContent=ans.trim();
 }catch(e){
  botDiv.textContent=`Réseau lent Maruce 🟢 Réessaye, mais pour "${txt}" : L'Amérique a 35 pays (Nord+Sud), monde a 8 milliards d'habitants !`;
 }
 isSending=false;chatEl.scrollTop=chatEl.scrollHeight;
}
function logout(){if(confirm('Déconnexion ?')){localStorage.removeItem('taya_user');location.reload();}}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script></body></html>

<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYA CHAT</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#080808;color:#fff;height:100vh;display:flex;flex-direction:column}.top{background:#111;padding:14px;text-align:center;border-bottom:1px solid #222}.top h1{color:#00FF88;font-size:20px}.chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 16px;border-radius:18px;max-width:85%}.bot{background:#1E1E1E;align-self:flex-start}.user{background:#00FF88;color:#000;align-self:flex-end}.bar{display:flex;padding:12px;background:#111;gap:8px}input{flex:1;padding:14px 18px;border-radius:24px;border:none;background:#222;color:#fff}button{padding:14px 22px;border-radius:24px;border:none;background:#00FF88;font-weight:800}</style></head><body><div class="top"><h1>🔺 TAYA CHAT</h1></div><div class="chat" id="c"><div class="msg bot">Salam ! C'est Taya 🔺 Pose ta question !</div></div><div class="bar"><input id="i" placeholder="Écris ici..." onkeydown="if(event.key==='Enter')go()"><button onclick="go()">➤</button></div><script>const r=["Puissant 🔺","Wallah clair 👊","Taya a compris !","🔺 Guinée avance !"];function go(){let e=document.getElementById('i'),t=e.value.trim();if(!t)return;let n=document.getElementById('c');n.innerHTML+=`<div class='msg user'>${t}</div>`;e.value='';setTimeout(()=>{n.innerHTML+=`<div class='msg bot'>${r[Math.floor(Math.random()*r.length)]}<br><small style='opacity:.5'>Tu as dit: ${t}</small></div>`;n.scrollTop=n.scrollHeight},600);n.scrollTop=n.scrollHeight}</script></body></html>

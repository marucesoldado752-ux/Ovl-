<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAYA V27 COURT</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Inter,sans-serif;height:100dvh;overflow:hidden}.header{height:64px;background:#0a0a0a;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 10px;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:30}.icon{width:42px;height:42px;border-radius:50%;background:#181818;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;cursor:pointer}.logo{font-family:Anton;font-size:26px}.logo span{color:#00ff88}.welcome{height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:#050505;overflow:auto}.w-card{width:100%;max-width:400px;background:#111;border:1px solid #222;border-radius:20px;padding:20px}.w-card h1{font-family:Anton;font-size:34px;text-align:center}.w-card h1 span{color:#00ff88}.w-card input,.w-card select{width:100%;background:#1b1b1b;border:1px solid #2a2a2a;color:#fff;padding:12px;border-radius:10px;margin:5px 0;outline:none}.row{display:flex;gap:6px;margin:5px 0}.row select{flex:1}.row input{flex:1.7;margin:0}.w-card button{width:100%;margin-top:12px;background:#00ff88;color:#000;border:none;padding:13px;border-radius:12px;font-weight:700}.home{padding:78px 14px 14px;height:100dvh;overflow:auto}.card{background:#141414;border:1px solid #222;border-radius:14px;padding:14px;cursor:pointer;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chatWrap{height:100dvh;padding-top:64px;display:flex;flex-direction:column}.chat{flex:1;overflow:auto;padding:12px 10px 110px;display:flex;flex-direction:column;gap:10px}.msg{max-width:84%;padding:11px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.6}.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}.bot{align-self:flex-start;background:#181818;border:1px solid #262626}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#0a0a0a;border-top:1px solid #222;z-index:20}.bar input{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:26px;outline:none;font-size:15px}.bar button{width:48px;height:48px;border-radius:50%;background:#00ff88;color:#000;border:none;font-weight:700;font-size:18px;flex-shrink:0}.drawer{position:fixed;top:0;left:0;width:86%;max-width:360px;height:100dvh;background:#0f0f0f;border-right:1px solid #222;z-index:50;transform:translateX(-100%);transition:.2s;padding:16px;overflow:auto;padding-bottom:90px}.drawer.open{transform:translateX(0)}.mi{padding:12px;border-radius:10px;cursor:pointer;margin:6px 0;background:#151515;border:1px solid #222;display:flex;justify-content:space-between;align-items:center}.proj{background:#151515;border:1px solid #222;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}</style></head><body>
<div class="header" id="header" style="display:none"><div style="display:flex;align-items:center;gap:8px"><div class="icon" onclick="toggleMenu()">☰</div><div class="logo">🤖 TAYA <span>IA</span></div></div><div style="display:flex;gap:6px"><div class="icon" onclick="goHome()">🏠</div><div class="icon" onclick="newChat()">🔄</div></div></div>
<div id="welcome" class="welcome"><div class="w-card"><h1>🤖 TAYA <span>IA</span></h1><p style="text-align:center;color:#00ff88;font-size:11px;margin:8px 0">V27 COURT 0.01s</p><input id="wName" placeholder="Nom complet"><div class="row"><select id="cc"></select><input id="wPhone" placeholder="Numéro"></div><input id="wPass" type="password" placeholder="Mot de passe"><input id="wPass2" type="password" placeholder="Confirmer"><button onclick="enterApp()">ENTRER ⚡</button></div></div>
<div id="homeScreen" style="display:none"><div class="home"><div id="helloName" style="font-family:Anton;font-size:24px"></div><p style="color:#888;font-size:13px;margin-bottom:12px">Ton IA qui répond à tout instantanément</p><div class="grid"><div class="card" onclick="newChat()"><b>💬 Nouveau Chat</b><br><small style="color:#00ff88">0.01s</small></div><div class="card" onclick="toggleMenu()"><b>⚙️ Menu</b><br><small id="projCount">0 chats</small></div></div><div class="card" onclick="openMessageToMaruce()" style="margin-top:10px;border-color:#00ff88"><b>💌 Écrire à Maruce</b></div><div style="margin-top:14px;color:#666;font-size:12px">📦 PACK</div><div id="projectsListHome"></div></div></div>
<div id="chatScreen" style="display:none" class="chatWrap"><div id="chatEl" class="chat"></div><div class="bar"><input id="inputEl" placeholder="Pose ta question..."><button onclick="send()">➤</button></div></div>
<div id="drawer" class="drawer"><h2 style="font-family:Anton">TAYA V27</h2><div class="mi" onclick="goHome();toggleMenu()">🏠 Accueil</div><div class="mi" onclick="newChat();toggleMenu()">💬 Nouveau Chat</div><div class="mi" onclick="openMessageToMaruce();toggleMenu()">💌 Écrire à Maruce</div><div class="mi" onclick="clearAllChats()">🗑️ Effacer</div><div style="margin:14px 0 6px;color:#666;font-size:11px">📦 PACK</div><div id="projectsList"></div><div style="margin:14px 0 6px;color:#666;font-size:11px">📞 CONTACT</div><div class="mi" onclick="window.open('https://wa.me/224663401157','_blank')">💬 WhatsApp <small>663-40-11-57</small></div><div class="mi" onclick="window.open('tel:+224612768878')">📞 Appeler <small>612-76-88-78</small></div><div id="adminSection" style="display:none"><div id="adminList"></div><div id="adminMessages"></div></div><div class="mi" onclick="logout()" style="margin-top:18px;color:#ff6666">🚪 Déconnexion</div></div>
<script>
let cc=document.getElementById('cc');[["🇬🇳 +224","+224"],["🇫🇷 +33","+33"]].forEach(c=>{let o=document.createElement('option');o.value=c[1];o.textContent=c[0];if(c[1]=="+224")o.selected=true;cc.appendChild(o);});
let chatEl=document.getElementById('chatEl'),inputEl=document.getElementById('inputEl'),welcome=document.getElementById('welcome'),homeScreen=document.getElementById('homeScreen'),chatScreen=document.getElementById('chatScreen'),header=document.getElementById('header'),drawer=document.getElementById('drawer'),wName=document.getElementById('wName'),wPhone=document.getElementById('wPhone'),wPass=document.getElementById('wPass'),wPass2=document.getElementById('wPass2'),helloName=document.getElementById('helloName'),projectsList=document.getElementById('projectsList'),projectsListHome=document.getElementById('projectsListHome'),projCount=document.getElementById('projCount'),adminList=document.getElementById('adminList'),adminSection=document.getElementById('adminSection'),adminMessages=document.getElementById('adminMessages');
let user=null;let projects=JSON.parse(localStorage.getItem('taya_projects_v22')||'[]');let allUsers=JSON.parse(localStorage.getItem('taya_users_v22')||'[]');let messagesToMaruce=JSON.parse(localStorage.getItem('taya_msg_maruce')||'[]');
let s=localStorage.getItem('taya_user');if(s){let u=JSON.parse(s);wName.value=u.name;wPhone.value=u.phoneRaw||'';}
function enterApp(){let n=wName.value.trim(),pRaw=wPhone.value.trim(),code=cc.value,pass=wPass.value.trim(),pass2=wPass2.value.trim();if(!n||!pRaw||!pass||!pass2){alert('Remplis tout');return;}if(pass!==pass2){alert('Mots de passe différents');return;}let full=code+' '+pRaw;user={name:n,phoneRaw:pRaw,country:code,phoneFull:full,phone:code.replace('+','')+pRaw,date:new Date().toLocaleString()};localStorage.setItem('taya_user',JSON.stringify(user));let idx=allUsers.findIndex(x=>x.phoneFull===full);if(idx>=0)allUsers[idx]=user;else allUsers.push(user);localStorage.setItem('taya_users_v22',JSON.stringify(allUsers));showHome();}
function showHome(){welcome.style.display='none';chatScreen.style.display='none';homeScreen.style.display='block';header.style.display='flex';helloName.textContent=`Salut ${user.name} !`;updateUI();}
function goHome(){chatScreen.style.display='none';homeScreen.style.display='block';}
function newChat(){
 chatEl.innerHTML='';homeScreen.style.display='none';chatScreen.style.display='flex';
 add(`Salut ${user.name} ! 👋\nTAYA à ton service, je réponds à tout en 0,01s ⚡`,'bot');
}
function toggleMenu(){drawer.classList.toggle('open');if(drawer.classList.contains('open'))updateUI();}
function add(t,w){let d=document.createElement('div');d.className='msg '+w;d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}
function updateUI(){projCount.textContent=projects.length+' chats';let html=projects.map((p,i)=>`<div class="proj" onclick="openProj(${i})"><b>${p.title}</b></div>`).join('')||'<div style="color:#666;font-size:12px">Aucun</div>';projectsList.innerHTML=html;projectsListHome.innerHTML=html;if(user&&(user.phone.includes('612768878')||user.phone.includes('663401157'))){adminSection.style.display='block';adminList.innerHTML=allUsers.map(u=>`<div>${u.name} - ${u.phoneFull}</div>`).join('');adminMessages.innerHTML=messagesToMaruce.map(m=>`<div>${m.name}: ${m.text}</div>`).join('');}}
function openProj(i){let p=projects[i];chatEl.innerHTML='';homeScreen.style.display='none';chatScreen.style.display='flex';p.msgs.forEach(m=>add(m.text,m.who));drawer.classList.remove('open');}
function saveChat(){let msgs=[...chatEl.querySelectorAll('.msg')].map(el=>({who:el.classList.contains('user')?'user':'bot',text:el.textContent}));if(msgs.length<2)return;let title=msgs.find(m=>m.who==='user')?.text.slice(0,35)||'Chat';projects.unshift({title,date:new Date().toLocaleString(),msgs});if(projects.length>50)projects=projects.slice(0,50);localStorage.setItem('taya_projects_v22',JSON.stringify(projects));updateUI();}
function clearAllChats(){if(confirm('Effacer ?')){projects=[];localStorage.removeItem('taya_projects_v22');updateUI();}}
function openMessageToMaruce(){let txt=prompt(`Message à Maruce (${user.name})`);if(!txt)return;messagesToMaruce.unshift({name:user.name,phone:user.phoneFull,text:txt,date:new Date().toLocaleString()});localStorage.setItem('taya_msg_maruce',JSON.stringify(messagesToMaruce));alert('Envoyé !');updateUI();}
function logout(){localStorage.removeItem('taya_user');location.reload();}
function reponseUniverselle(qOrig){
 let q=qOrig.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
 const db=[
  [/afrique.*pays|pays.*afrique/, "L'Afrique a 54 pays reconnus par l'ONU ! 🌍"],
  [/amerique.*pays|pays.*amerique/, "Amérique = 35 pays !"],
  [/monde.*pays|pays.*monde/, "Monde = 195 pays !"],
  [/monde.*habitant|habitant.*monde/, "Monde = 8,1 milliards d'habitants !"],
  [/femme.*pays|pays.*femme/, "Pays avec plus de femmes : Chine 700M femmes ! Russie 54% femmes."],
  [/plus.*grand.*habitant|pays.*peuple/, "Pays plus peuplé : Inde 1,43Mds, Chine 1,42Mds."],
  [/facebook/, "Facebook créé par Mark Zuckerberg en 2004 à Harvard."],
  [/whatsapp/, "WhatsApp créé par Jan Koum et Brian Acton en 2009 !"],
 ];
 for(let [re, ans] of db){ if(re.test(q)) return ans; }
 return `Pour "${qOrig}" : Réponse instantanée - Monde 195 pays, Afrique 54, habitants 8,1Mds !`;
}
function send(){let txt=inputEl.value.trim();if(!txt)return;add(txt,'user');inputEl.value='';let botDiv=add(reponseUniverselle(txt),'bot');saveChat();(async()=>{try{let r=await fetch(`https://text.pollinations.ai/${encodeURIComponent(`Tu es TAYA IA créée par Maruce, réponds français court vrai à: ${txt}`)}`,{signal:AbortSignal.timeout(600)});let t=await r.text();if(t&&!t.includes('"status"')&&t.length>30&&t.length<700){if(t.length>botDiv.textContent.length-30){botDiv.textContent=t;saveChat();}}}catch(e){}})();}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script></body></html>
